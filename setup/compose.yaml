# TrackFlow — Docker Compose (local)
# Lance uniquement PostgreSQL. Pas de build d'image applicative.
#
# Usage (depuis le dossier setup/) :
#   docker compose --env-file .env up -d
#   docker compose --env-file .env down
#   docker compose --env-file .env logs -f db

name: trackflow

services:
  db:
    image: postgres:16-alpine
    container_name: trackflow
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - trackflow_pgdata:/var/lib/postgresql/data
    networks:
      - trackflow-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  trackflow-network:
    name: trackflow-network
    driver: bridge

volumes:
  trackflow_pgdata:
    name: trackflow_pgdata
